name: The Daily Scoop Auto Poster

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily at 2:00 PM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pillow requests

      - name: Run Auto Poster Script
        run: python ice_cream_auto_poster.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}

      - name: Commit and push updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git stash
          git pull --rebase origin main || git pull --rebase origin master
          git stash pop || true
          git add history.txt  # (use reel_history.txt for your reel workflow)
          git diff --staged --quiet || git commit -m "chore: update history [skip ci]"
          git push
