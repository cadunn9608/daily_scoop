name: Daily Facebook Reel Poster

on:
  schedule:
    - cron: '0 18 * * *'  # Runs daily at 6:00 PM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install google-genai pillow requests

      - name: Run Reel Poster Script
        run: python ice_cream_reel_poster.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

      - name: Commit and push updated reel history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add reel_history.txt
          git diff --staged --quiet || git commit -m "chore: update reel history.txt [skip ci]"
          git push
